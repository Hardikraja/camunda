# description: Create a Camunda load test for an individual PR. When a PR is closed, the test is cleaned up and removed
# type: CI
# owner @camunda/reliability-testing
name: Camunda Pull Request Benchmark
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - closed

defaults:
  run:
    # use bash shell by default to ensure pipefail behavior is the default
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

env:
  CLUSTER: camunda-benchmark-prod
  TELEPORT_JOIN_TOKEN: infra-benchmark-prod-github-action-zeebe

jobs:
  sanitize-branch-name:
    name: Sanitize Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      sanitized-name: ${{ steps.compute-namespace.outputs.namespace }}
      legacy-namespace: c8-${{ steps.legacy-sanitize.outputs.branch_name }}
    steps:
      - id: compute-namespace
        name: Compute safe namespace from branch name
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Sanitize: lowercase, replace non-alphanumeric chars with hyphens, collapse and trim
          # Use printf instead of echo to avoid misinterpreting branch names starting with -n/-e as flags
          sanitized=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//' | sed 's/-$//')
          # Take first 20 chars of sanitized name, trimming any trailing hyphen
          prefix="${sanitized:0:20}"
          prefix="${prefix%-}"
          # Compute a 7-char hash from the full sanitized name to ensure uniqueness
          hash=$(printf '%s' "$sanitized" | sha256sum | cut -c1-7)
          # Compose namespace: c8- (3) + prefix (≤20) + - (1) + hash (7) = ≤31 chars total
          # This keeps Kubernetes service names well within the 63-char limit
          namespace="c8-${prefix}-${hash}"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
      # Compute the legacy namespace using the same external action that was previously used,
      # so delete-benchmark can clean up namespaces deployed before the hash-based scheme.
      - id: legacy-sanitize
        uses: camunda/infra-global-github-actions/sanitize-branch-name@main
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          max_length: 50
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  create-benchmark:
    name: Benchmark
    needs: sanitize-branch-name
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'benchmark') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    uses: ./.github/workflows/camunda-load-test.yml
    secrets: inherit
    with:
      name: ${{ needs.sanitize-branch-name.outputs.sanitized-name }}
      ref: ${{ github.event.pull_request.head.ref }}
      scenario: 'max'

  await-benchmark:
    name: Await Benchmark
    needs: [sanitize-branch-name, create-benchmark]
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'benchmark') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Wait for load test to stabilize
        run: sleep 900  # 15 minutes
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  run-profiling:
    name: Run Profiling
    needs: [sanitize-branch-name, await-benchmark]
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'benchmark') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    uses: ./.github/workflows/profile-load-test.yml
    secrets: inherit
    with:
      name: ${{ needs.sanitize-branch-name.outputs.sanitized-name }}
      pod: ''

  comment-pr:
    name: Comment on PR with profiling results
    needs: [sanitize-branch-name, run-profiling]
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'benchmark') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: 'read'
      pull-requests: 'write'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Comment PR with profiling results
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // List all downloaded artifacts
            const artifactPath = 'artifacts';
            const artifacts = fs.readdirSync(artifactPath);

            // Get artifact IDs from GitHub API
            const { data: workflowArtifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            let comment = '## Profiling Results\n\n';
            comment += 'The benchmark has been profiled with the following events:\n\n';
            comment += '| Event | Pod | Artifact |\n';
            comment += '|-------|-----|----------|\n';

            artifacts.forEach(artifact => {
              const match = artifact.match(/flamegraph-(\w+)-(\w+-\d+)/);
              if (match) {
                const event = match[1];
                const pod = match[2];

                // Find the artifact ID for this artifact name
                const artifactInfo = workflowArtifacts.artifacts.find(a => a.name === artifact);
                if (artifactInfo) {
                  const downloadUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${artifactInfo.id}`;
                  comment += `| ${event} | ${pod} | [Download](${downloadUrl}) |\n`;
                } else {
                  comment += `| ${event} | ${pod} | N/A |\n`;
                }
              }
            });

            comment += '\n📊 [View all artifacts and workflow summary](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}

  delete-benchmark:
    name: Benchmark Cleanup
    needs: sanitize-branch-name
    if: >
      (github.event.action == 'unlabeled' && github.event.label.name == 'benchmark') ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Teleport
        uses: teleport-actions/setup@v1
        with:
          proxy: camunda.teleport.sh:443
          version: auto

      - name: Authenticate to Cluster using Teleport
        uses: teleport-actions/auth-k8s@v2
        with:
          proxy: camunda.teleport.sh:443
          token: ${{ env.TELEPORT_JOIN_TOKEN }}
          kubernetes-cluster: ${{ env.CLUSTER }}

      - name: Delete benchmarks
        env:
          CURRENT_NS: ${{ needs.sanitize-branch-name.outputs.sanitized-name }}
          LEGACY_NS: ${{ needs.sanitize-branch-name.outputs.legacy-namespace }}
        run: |
          # Delete the namespace under the current naming scheme.
          kubectl delete ns "$CURRENT_NS" --ignore-not-found
          # Also attempt to delete the namespace under the legacy naming scheme (used before the
          # hash-based scheme was introduced), in case the PR was deployed before this change.
          # This is best-effort (|| true): --ignore-not-found only suppresses "Not Found" errors,
          # but K8s may return "Forbidden" for non-existent namespaces when the service account
          # lacks cluster-wide namespace-delete permissions.
          if [[ "$LEGACY_NS" != "$CURRENT_NS" ]]; then
            kubectl delete ns "$LEGACY_NS" --ignore-not-found || true
          fi
      - name: Observe build status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/observe-build-status
        with:
          build_status: ${{ job.status }}
          secret_vault_address: ${{ secrets.VAULT_ADDR }}
          secret_vault_roleId: ${{ secrets.VAULT_ROLE_ID }}
          secret_vault_secretId: ${{ secrets.VAULT_SECRET_ID }}
