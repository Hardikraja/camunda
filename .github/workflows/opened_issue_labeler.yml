# type: Project Management
# owner: Engineering Ops
name: "Opened Issue Labeler"
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
    - name: Import Secrets
      id: secrets
      uses: hashicorp/vault-action@v3.4.0
      with:
        url: ${{ secrets.VAULT_ADDR }}
        method: approle
        roleId: ${{ secrets.VAULT_ROLE_ID }}
        secretId: ${{ secrets.VAULT_SECRET_ID }}
        exportEnv: false
        secrets: |
          secret/data/products/camunda/ci/github-actions GH_PROJECT_AUTOMATION_TOKEN;
    - uses: github/issue-labeler@v3.4
      with:
        configuration-path: .github/opened_issue_labeler.yml
        enable-versioned-regex: 0
        repo-token: ${{ steps.secrets.outputs.GH_PROJECT_AUTOMATION_TOKEN }}
