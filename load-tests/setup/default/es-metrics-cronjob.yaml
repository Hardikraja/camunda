apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-metrics-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: es-metrics-collector
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 100
          initContainers:
            - name: init-permissions
              image: busybox:1.36
              command: ["sh", "-c", "mkdir -p /data/snapshots && chown -R 100:100 /data"]
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: es-metrics-data
                  mountPath: /data
          volumes:
            - name: es-metrics-data
              persistentVolumeClaim:
                claimName: es-metrics-data
          containers:
            - name: es-metrics-collector
              image: curlimages/curl:7.87.0
              volumeMounts:
                - name: es-metrics-data
                  mountPath: /data
              env:
                - name: ES_URL
                  value: "http://__NAMESPACE__-elasticsearch:9200"
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  SNAPSHOT_DIR="/data/snapshots"
                  TIMESERIES_FILE="/data/timeseries.ndjson"
                  SNAPSHOT_FILE="${SNAPSHOT_DIR}/${TIMESTAMP}.json"

                  mkdir -p "${SNAPSHOT_DIR}"

                  echo "=== ES Metrics Collection: ${TIMESTAMP} ==="

                  # --- Cluster health ---
                  echo "Collecting cluster health..."
                  CLUSTER_HEALTH=$(curl -s "${ES_URL}/_cluster/health")

                  # --- Index stats for all target index patterns ---
                  echo "Collecting index stats..."
                  OPTIMIZE_STATS=$(curl -s "${ES_URL}/optimize-*/_stats?level=shards" 2>/dev/null || echo '{}')
                  ZEEBE_STATS=$(curl -s "${ES_URL}/zeebe-*/_stats" 2>/dev/null || echo '{}')
                  TASKLIST_STATS=$(curl -s "${ES_URL}/tasklist-*/_stats" 2>/dev/null || echo '{}')
                  OPERATE_STATS=$(curl -s "${ES_URL}/operate-*/_stats" 2>/dev/null || echo '{}')
                  CAMUNDA_STATS=$(curl -s "${ES_URL}/camunda-*/_stats" 2>/dev/null || echo '{}')

                  # --- Node stats (JVM, disk, thread pools, search, indexing) ---
                  echo "Collecting node stats..."
                  NODE_STATS=$(curl -s "${ES_URL}/_nodes/stats/jvm,fs,thread_pool,indices" 2>/dev/null || echo '{}')

                  # --- Cat indices for quick overview ---
                  echo "Collecting index overview..."
                  CAT_OPTIMIZE=$(curl -s "${ES_URL}/_cat/indices/optimize-*?format=json&h=index,docs.count,docs.deleted,store.size,pri.store.size,seg.count" 2>/dev/null || echo '[]')
                  CAT_ZEEBE=$(curl -s "${ES_URL}/_cat/indices/zeebe-*?format=json&h=index,docs.count,store.size" 2>/dev/null || echo '[]')
                  CAT_TASKLIST=$(curl -s "${ES_URL}/_cat/indices/tasklist-*?format=json&h=index,docs.count,store.size" 2>/dev/null || echo '[]')
                  CAT_OPERATE=$(curl -s "${ES_URL}/_cat/indices/operate-*?format=json&h=index,docs.count,store.size" 2>/dev/null || echo '[]')
                  CAT_CAMUNDA=$(curl -s "${ES_URL}/_cat/indices/camunda-*?format=json&h=index,docs.count,store.size" 2>/dev/null || echo '[]')

                  # --- Shard distribution for optimize indices ---
                  echo "Collecting shard distribution..."
                  SHARD_DIST=$(curl -s "${ES_URL}/_cat/shards/optimize-*?format=json&h=index,shard,prirep,state,docs,store,node" 2>/dev/null || echo '[]')

                  # --- Build structured JSON snapshot ---
                  cat > "${SNAPSHOT_FILE}" <<SNAPSHOT_EOF
                  {
                    "timestamp": "${TIMESTAMP}",
                    "cluster_health": ${CLUSTER_HEALTH},
                    "indices": {
                      "optimize": {
                        "stats": ${OPTIMIZE_STATS},
                        "overview": ${CAT_OPTIMIZE},
                        "shards": ${SHARD_DIST}
                      },
                      "zeebe": {
                        "stats": ${ZEEBE_STATS},
                        "overview": ${CAT_ZEEBE}
                      },
                      "tasklist": {
                        "stats": ${TASKLIST_STATS},
                        "overview": ${CAT_TASKLIST}
                      },
                      "operate": {
                        "stats": ${OPERATE_STATS},
                        "overview": ${CAT_OPERATE}
                      },
                      "camunda": {
                        "stats": ${CAMUNDA_STATS},
                        "overview": ${CAT_CAMUNDA}
                      }
                    },
                    "nodes": ${NODE_STATS}
                  }
                  SNAPSHOT_EOF

                  echo "Snapshot saved: ${SNAPSHOT_FILE}"

                  # --- Build compact NDJSON timeseries line ---
                  # Extract key aggregate numbers using shell parsing from cat indices
                  # Count total docs and size per index group from the stats endpoints
                  HEALTH_STATUS=$(echo "${CLUSTER_HEALTH}" | sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
                  NODE_COUNT=$(echo "${CLUSTER_HEALTH}" | sed -n 's/.*"number_of_nodes"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')
                  ACTIVE_SHARDS=$(echo "${CLUSTER_HEALTH}" | sed -n 's/.*"active_shards"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')
                  UNASSIGNED_SHARDS=$(echo "${CLUSTER_HEALTH}" | sed -n 's/.*"unassigned_shards"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p')

                  NDJSON_LINE="{\"ts\":\"${TIMESTAMP}\",\"health\":\"${HEALTH_STATUS}\",\"nodes\":${NODE_COUNT:-0},\"active_shards\":${ACTIVE_SHARDS:-0},\"unassigned_shards\":${UNASSIGNED_SHARDS:-0}}"

                  echo "${NDJSON_LINE}" >> "${TIMESERIES_FILE}"
                  echo "Timeseries appended: ${TIMESERIES_FILE}"

                  # --- Disk usage summary ---
                  DATA_SIZE=$(du -sh /data 2>/dev/null | cut -f1)
                  echo "Total data on PVC: ${DATA_SIZE}"
                  echo "=== Collection complete ==="
